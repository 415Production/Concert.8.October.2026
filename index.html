<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เข้าสู่ระบบ - ผังที่นั่งคอนเสิร์ต</title>
    <style>
        body { 
            background: #0f1115; 
            color: white; 
            font-family: sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            touch-action: manipulation;
        }
        .login-container { 
            background: #1a1c23; 
            padding: 30px; 
            border-radius: 12px; 
            border: 1px solid #333; 
            width: 85%; 
            max-width: 350px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
            text-align: center; 
        }
        h2 { 
            color: #ffb74d; 
            margin-top: 0; 
            margin-bottom: 25px;
            font-size: 22px;
        }
        .input-group { 
            margin-bottom: 20px; 
            text-align: left; 
        }
        .input-group label { 
            display: block; 
            font-size: 13px; 
            color: #9ca3af; 
            margin-bottom: 8px; 
        }
        
        /* สไตล์สำหรับ Dropdown เลือกชื่อ */
        select { 
            width: 100%; 
            padding: 12px; 
            border-radius: 6px; 
            border: 1px solid #4b5563; 
            background: #111827; 
            color: white; 
            box-sizing: border-box; 
            font-size: 15px; 
            cursor: pointer;
        }
        select:focus {
            outline: none;
            border-color: #ffb74d;
        }
        
        .btn-admin { 
            background: #e50914; 
            color: white; 
            border: none; 
            padding: 14px; 
            width: 100%; 
            border-radius: 6px; 
            font-size: 15px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(229, 9, 20, 0.3);
        }
        .btn-admin:active { transform: scale(0.98); }
        
        .divider { 
            margin: 20px 0; 
            color: #6b7280; 
            font-size: 12px; 
            position: relative; 
        }
        .divider::before, .divider::after { 
            content: ""; 
            position: absolute; 
            top: 50%; 
            width: 40%; 
            height: 1px; 
            background: #374151; 
        }
        .divider::before { left: 0; }
        .divider::after { right: 0; }
        
        .btn-guest { 
            background: #374151; 
            color: white; 
            border: 1px solid #4b5563; 
            padding: 14px; 
            width: 100%; 
            border-radius: 6px; 
            font-size: 15px; 
            font-weight: bold; 
            cursor: pointer; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .btn-guest:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>ระบบจัดการผังที่นั่ง</h2>
        
        <div class="input-group">
            <label>เลือกชื่อแอดมิน (Select Admin)</label>
            <!-- แก้ไขชื่อทีมงานของคุณที่นี่ได้เลยครับ -->
            <select id="adminName">
                <option value="" disabled selected>-- กรุณาเลือกชื่อแอดมิน --</option>
                <option value="Admin 1">Admin 1</option>
                <option value="Admin 2">Admin 2</option>
                <option value="Admin 3">Admin 3</option>
                <option value="Admin 4">Admin 4</option>
            </select>
        </div>
        
        <button class="btn-admin" onclick="adminLogin()">เข้าสู่ระบบจัดการ</button>
        
        <div class="divider">หรือ</div>
        
        <button class="btn-guest" onclick="guestLogin()">ตรวจสอบผังที่นั่ง</button>
    </div>

    <script>
        function adminLogin() {
            const selectElement = document.getElementById('adminName');
            const name = selectElement.options[selectElement.selectedIndex].value;
            
            if (!name) {
                alert('กรุณาเลือกชื่อแอดมินก่อนเข้าสู่ระบบ');
                return;
            }

            // บันทึกชื่อแอดมินที่เลือกแล้วเปลี่ยนหน้าไปที่ผังที่นั่ง
            sessionStorage.setItem('adminName', name);
            window.location.href = 'seating.html';
        }

        function guestLogin() {
            // ตั้งค่าเป็นโหมดผู้ชมทั่วไป แล้วเปลี่ยนหน้าไปที่ผังที่นั่ง
            sessionStorage.setItem('adminName', 'Guest');
            window.location.href = 'seating.html';
        }
    </script>
</body>
</html>
