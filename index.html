<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - ต้นข้าว สุปรียา</title>
    <style>
        :root { --primary-color: #e50914; --bg-color: #0f1115; --card-bg: #1a1c23; --text-color: #ffffff; }
        body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: var(--card-bg); padding: 40px 30px; border-radius: 12px; width: 350px; text-align: center; border: 1px solid #333;}
        select, button { width: 100%; margin-top: 20px; padding: 12px; border-radius: 5px; border: none; box-sizing: border-box; font-size: 16px; font-weight: bold;}
        select { background: #111827; color: white; border: 1px solid #4b5563; text-align: center; cursor: pointer;}
        button { background: var(--primary-color); color: white; cursor: pointer; transition: 0.2s;}
        button:hover { background: #b0060f;}
        .guest-btn { background: #374151; margin-top: 15px;}
        .guest-btn:hover { background: #4b5563;}
    </style>
</head>
<body>
    <div class="login-box">
        <h2 style="margin-top:0;">คอนเสิร์ต ต้นข้าว สุปรียา</h2>
        <p style="color: #aaa; margin-bottom: 30px;">8 ตุลาคม 2569</p>
        
        <label style="display:block; text-align:left; font-size:14px; color:#aaa;">เลือกชื่อแอดมิน:</label>
        <select id="user">
            <option value="KEW">KEW</option>
            <option value="EURO">EURO</option>
            <option value="NK">NK</option>
        </select>
        
        <button onclick="loginAdmin()">เข้าสู่ระบบจัดการที่นั่ง</button>
        <button class="guest-btn" onclick="loginGuest()">ดูผังที่นั่ง (ผู้ชมทั่วไป)</button>
    </div>

    <script>
        function loginAdmin() {
            const user = document.getElementById('user').value;
            sessionStorage.setItem('adminName', user); // บันทึกชื่อลงเบราว์เซอร์
            window.location.href = "seating.html"; // เปลี่ยนหน้าทันที
        }

        function loginGuest() {
            sessionStorage.setItem('adminName', 'Guest');
            window.location.href = "seating.html";
        }
    </script>
</body>
</html>
