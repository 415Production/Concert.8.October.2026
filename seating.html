<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ผังที่นั่งคอนเสิร์ต</title>
    <script src="https://unpkg.com/@panzoom/panzoom/dist/panzoom.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        body { background: #0f1115; color: white; font-family: sans-serif; margin: 0; overflow: hidden; touch-action: none; }
        
        /* Header */
        .header { padding: 10px 15px; background: #1a1c23; display: flex; justify-content: space-between; align-items: center; z-index: 20; position: fixed; top: 0; left: 0; width: 100%; box-sizing: border-box; border-bottom: 1px solid #333; height: 60px;}
        .btn-back { background: #4b5563; color: white; padding: 6px 12px; border-radius: 5px; text-decoration: none; font-size: 14px; font-weight: bold;}
        .btn-capture { background: #e50914; color: white; padding: 6px 12px; border-radius: 5px; border: none; font-weight: bold; cursor: pointer; font-size: 14px;}
        
        /* Footer แถบสถานะ */
        .footer { padding: 10px; background: #1a1c23; display: flex; justify-content: center; align-items: center; z-index: 20; position: fixed; bottom: 0; left: 0; width: 100%; box-sizing: border-box; border-top: 1px solid #333; height: 50px;}
        .legend { display: flex; align-items: center; font-size: 12px; font-weight: bold;}
        .legend span { display: inline-block; width: 12px; height: 12px; margin: 0 5px 0 12px; border-radius: 3px; }
        
        /* ปุ่มลอยควบคุมซูม */
        .floating-controls { 
            position: fixed; bottom: 65px; left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: row; gap: 10px; z-index: 30; align-items: center;
        }
        .fab-btn { 
            width: 38px; height: 38px; border-radius: 50%; 
            background: #374151; color: white; border: 1px solid #4b5563; 
            font-size: 20px; font-weight: bold; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.6);
        }
        .fab-btn-reset { 
            width: auto; height: 35px; border-radius: 18px; 
            font-size: 12px; padding: 0 15px; 
            background: #e50914; border: none; font-weight: bold; color: white;
            white-space: nowrap; box-shadow: 0 4px 8px rgba(0,0,0,0.6); cursor: pointer;
        }

        /* พื้นที่แสดงผังซูมได้ */
        .map-container { 
            position: fixed; top: 60px; left: 0; width: 100vw; height: calc(100vh - 110px); 
            cursor: grab; display: flex; justify-content: center; align-items: flex-start; 
            overflow: hidden; touch-action: none;
        }
        
        #seatingArea { 
            display: grid; 
            grid-template-columns: repeat(5, auto); 
            grid-template-rows: repeat(6, auto);
            gap: 15px; padding: 30px; background: #0f1115; 
            transform-origin: center center;
        }
        
        #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: #0f1115; z-index: 50; }

        /* เวที */
        .stage-container { grid-area: 1 / 3; display: flex; flex-direction: column; align-items: center; height: 100%;}
        .stage-main { width: 100%; height: 45px; background: #ffb74d; border-radius: 6px; display: flex; justify-content: center; align-items: center; color: #000; font-weight: bold; font-size: 16px;}
        .stage-catwalk { width: 40%; height: 50px; background: #ffb74d; border-bottom-left-radius: 6px; border-bottom-right-radius: 6px;}

        /* โซนต่างๆ */
        .zone { border: 1px solid #333; padding: 8px; border-radius: 8px; background: #1a1c23; }
        
        /* หัวข้อโซน: ทำให้กดได้ เพื่อซูมโฟกัส */
        .zone-title { 
            text-align: center; font-size: 11px; font-weight: bold; margin-bottom: 6px; color: #fff; background: #941724; padding: 4px; border-radius: 4px;
            cursor: pointer; transition: 0.1s;
        }
        .zone-title:active { transform: scale(0.95); opacity: 0.8; }
        .zone-title.normal { background: #263238; }
        
        .seats-grid { display: grid; gap: 3px; justify-content: center; }
        
        /* เก้าอี้ขนาดกะทัดรัด เห็นภาพรวมชัด */
        .seat { 
            width: 18px; height: 18px; border-radius: 3px; cursor: pointer; 
            font-size: 9px; font-weight: bold; display: flex; justify-content: center; align-items: center; 
        }
        .seat:hover { opacity: 0.7; transform: scale(1.2); }
        
        .status-Available { background: #374151; color: #9ca3af; }
        .status-Pending { background: #f59e0b; color: #000; }
        .status-Booked { background: #dc2626; color: #fff; }
        
        /* Modal */
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1f2937; padding: 20px; border-radius: 12px; z-index: 100; width: 85%; max-width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,0.9); border: 1px solid #4b5563;}
        .modal h3 { margin-top: 0; color: #f3f4f6; text-align: center; font-size: 18px;}
        .input-group { margin-bottom: 12px; text-align: left; }
        .input-group label { display: block; font-size: 12px; color: #9ca3af; margin-bottom: 4px; }
        .input-group input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #4b5563; background: #111827; color: white; box-sizing: border-box; font-size: 15px;}
        .action-btns { display: flex; flex-direction: column; gap: 8px; }
        .modal button { padding: 10px; cursor: pointer; border: none; border-radius: 6px; font-weight: bold; font-size: 14px;}
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" class="btn-back">← กลับ</a>
        <span id="currentUser" style="color:#ffb74d; font-weight: bold; font-size: 13px;"></span>
        <button class="btn-capture" onclick="captureMap()">แคปผัง</button>
    </div>

    <!-- ปุ่มควบคุมซูมลอยด้านล่าง -->
    <div class="floating-controls">
        <button class="fab-btn" onclick="panzoom.zoomOut()">-</button>
        <button class="fab-btn-reset" onclick="fitToScreen()">กึ่งกลางจอ</button>
        <button class="fab-btn" onclick="panzoom.zoomIn()">+</button>
    </div>

    <div class="map-container" id="mapContainer">
        <div id="loadingOverlay"><h2 style="color: #888;">กำลังโหลดผังที่นั่ง...</h2></div>
        <div id="seatingArea"></div>
    </div>

    <div class="footer">
        <div class="legend">
            <span style="background:#374151;"></span>ว่าง
            <span style="background:#f59e0b;"></span>รอโอน
            <span style="background:#dc2626;"></span>จองแล้ว
        </div>
    </div>

    <div class="modal" id="actionModal">
        <h3 id="modalSeatId"></h3>
        <div class="input-group"><label>ชื่อลูกค้า</label><input type="text" id="custName" placeholder="กรอกชื่อลูกค้า"></div>
        <div class="input-group"><label>เบอร์โทรศัพท์</label><input type="text" id="custPhone" placeholder="กรอกเบอร์โทร"></div>
        <div class="action-btns">
            <button style="background: #dc2626; color: white;" onclick="updateStatus('Booked')">ยืนยันจอง (Booked)</button>
            <button style="background: #f59e0b; color: black;" onclick="updateStatus('Pending')">รอโอน (Pending)</button>
            <button style="background: #374151; color: white;" onclick="updateStatus('Available')">ยกเลิกจอง (ตั้งเป็นว่าง)</button>
            <button style="background: transparent; color: #9ca3af; border: 1px solid #4b5563;" onclick="document.getElementById('actionModal').style.display='none'">ปิด</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxnh9eh_SQBpkuEVlb42onEWnUNmMtGtujz1yStLz70OSUnDVWKFRvG_sztDXcKhU81/exec"; 
        
        const adminName = sessionStorage.getItem('adminName');
        document.getElementById('currentUser').innerText = adminName && adminName !== "Guest" ? `Admin: ${adminName}` : "ผู้ชมทั่วไป";
        
        let currentSelectedSeat = "";
        window.seatDataMap = {}; 
        let zoneElements = {}; // เก็บ element ของแต่ละโซนไว้ใช้อ้างอิงตอนกดซูม

        const layoutGrid = {
            "ZONE A": "1 / 1", "VIP 1": "1 / 2", "VIP 2": "1 / 4", "ZONE B": "1 / 5",
            "ZONE C": "2 / 1", "VIP 3": "2 / 2", "VIP 4": "2 / 3", "VIP 5": "2 / 4", "ZONE D": "2 / 5",
            "ZONE E": "3 / 1", "VIP 6": "3 / 2", "VIP 7": "3 / 3", "VIP 8": "3 / 4", "ZONE F": "3 / 5",
            "ZONE G": "4 / 1", "ZONE H": "4 / 2", "ZONE I": "4 / 3", "ZONE J": "4 / 4", "ZONE K": "4 / 5",
            "ZONE L": "5 / 1", "ZONE M": "5 / 2", "ZONE N": "5 / 3", "ZONE O": "5 / 4", "ZONE P": "5 / 5",
            "ZONE Q": "6 / 1", "ZONE R": "6 / 2", "ZONE S": "6 / 3", "ZONE T": "6 / 4", "ZONE U": "6 / 5"
        };

        const elem = document.getElementById('seatingArea');
        const panzoom = Panzoom(elem, { maxScale: 5, minScale: 0.1, contain: false, step: 0.15 });
        elem.parentElement.addEventListener('wheel', panzoom.zoomWithWheel);

        async function loadSeats() {
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: "getSeats" })
                });
                const result = await response.json();
                
                if (result.status === "success") {
                    document.getElementById('loadingOverlay').style.display = 'none';
                    renderSeats(result.data);
                    setTimeout(fitToScreen, 200);
                } else {
                    document.getElementById('loadingOverlay').innerHTML = `<h2 style="color:red;">ข้อผิดพลาด: ${result.message}</h2>`;
                }
            } catch (e) {
                document.getElementById('loadingOverlay').innerHTML = `<h2 style="color:red;">ไม่สามารถเชื่อมต่อฐานข้อมูลได้</h2>`;
            }
        }

        // ซูมออกดูภาพรวมทั้งผัง
        function fitToScreen() {
            const area = document.getElementById('seatingArea');
            const screenW = window.innerWidth;
            const screenH = window.innerHeight - 110; 
            const areaW = area.offsetWidth;
            const areaH = area.offsetHeight;
            
            const scaleX = (screenW * 0.95) / areaW;
            const scaleY = (screenH * 0.95) / areaH;
            const targetScale = Math.min(scaleX, scaleY);
            
            panzoom.pan(0, 0);
            panzoom.zoom(targetScale, { animate: true });
        }

        // ฟังก์ชันคลิกที่ชื่อโซน เพื่อซูมโฟกัสไปที่โซนนั้นๆ
        function focusOnZone(zoneName) {
            const zoneDiv = zoneElements[zoneName];
            if (!zoneDiv) return;

            const container = document.getElementById('mapContainer');
            const cWidth = container.clientWidth;
            const cHeight = container.clientHeight;

            // คำนวณตำแหน่งกึ่งกลางของโซนเทียบกับผังหลัก
            const zRect = zoneDiv.getBoundingClientRect();
            const eRect = elem.getBoundingClientRect();

            // คำนวณพิกัดเพื่อดึงโซนมาไว้กลางจอด้วยสเกลขยาย 2.5 เท่า
            const targetScale = 2.5;
            const currentScale = panzoom.getScale();
            
            // หาจุดกึ่งกลางของโซนในสเกลปัจจุบัน
            const zoneCenterX = (zRect.left + zRect.width / 2) - eRect.left;
            const zoneCenterY = (zRect.top + zRect.height / 2) - eRect.top;

            const panX = (cWidth / 2) - (zoneCenterX * targetScale);
            const panY = (cHeight / 2) - (zoneCenterY * targetScale);

            panzoom.zoom(targetScale, { animate: true });
            panzoom.pan(panX / targetScale, panY / targetScale, { animate: true });
        }

        function renderSeats(data) {
            const area = document.getElementById('seatingArea');
            area.innerHTML = "";
            zoneElements = {};
            
            const stageContainer = document.createElement('div');
            stageContainer.className = 'stage-container';
            stageContainer.innerHTML = `<div class="stage-main">STAGE</div><div class="stage-catwalk"></div>`;
            area.appendChild(stageContainer);

            const zones = {};

            data.forEach(row => {
                const id = row[0].toString().trim(); 
                if(!id) return;
                
                window.seatDataMap[id] = {
                    status: row[3] ? row[3].toString().trim() : "Available",
                    customerName: row[4] ? row[4].toString().trim() : "",
                    phone: row[7] ? row[7].toString().trim() : ""
                };

                const prefix = id.split('-')[0]; 
                if (!zones[prefix]) zones[prefix] = [];
                zones[prefix].push(id);
            });

            Object.keys(zones).forEach(zoneName => {
                const zoneDiv = document.createElement('div');
                zoneDiv.className = 'zone';
                if (layoutGrid[zoneName]) zoneDiv.style.gridArea = layoutGrid[zoneName];
                
                zoneElements[zoneName] = zoneDiv; // บันทึกเก็บไว้ใช้อ้างอิงตอนกดซูม

                const isVip = zoneName.includes('VIP');
                
                // หัวข้อโซน: พ่วง Event คลิกเพื่อซูมโฟกัส
                const titleDiv = document.createElement('div');
                titleDiv.className = `zone-title ${isVip ? '' : 'normal'}`;
                titleDiv.innerText = zoneName + " (แตะเพื่อซูม)";
                titleDiv.onclick = () => focusOnZone(zoneName);
                zoneDiv.appendChild(titleDiv);
                
                const gridDiv = document.createElement('div');
                gridDiv.className = 'seats-grid';
                
                const seatCount = zones[zoneName].length;
                gridDiv.style.gridTemplateColumns = seatCount > 50 ? 'repeat(15, 1fr)' : 'repeat(10, 1fr)';
                
                zones[zoneName].forEach(seatId => {
                    const btn = document.createElement('div');
                    const seatInfo = window.seatDataMap[seatId];
                    const seatNumber = parseInt(seatId.split('-')[1], 10);
                    
                    btn.className = `seat status-${seatInfo.status}`; 
                    btn.id = `seat-${seatId}`;
                    btn.innerText = seatNumber; 
                    
                    if (adminName && adminName !== "Guest") {
                        btn.onclick = () => openModal(seatId);
                    }
                    gridDiv.appendChild(btn);
                });
                
                zoneDiv.appendChild(gridDiv);
                area.appendChild(zoneDiv);
            });
        }

        function openModal(seatId) {
            currentSelectedSeat = seatId;
            document.getElementById('modalSeatId').innerText = "ที่นั่ง: " + seatId;
            
            const seatInfo = window.seatDataMap[seatId];
            document.getElementById('custName').value = seatInfo.customerName || "";
            document.getElementById('custPhone').value = seatInfo.phone || "";
            
            document.getElementById('actionModal').style.display = "block";
        }

        async function updateStatus(newStatus) {
            const cName = document.getElementById('custName').value;
            const cPhone = document.getElementById('custPhone').value;

            document.getElementById('actionModal').style.display = "none";
            
            const seatElem = document.getElementById(`seat-${currentSelectedSeat}`);
            seatElem.className = `seat status-${newStatus}`;
            
            window.seatDataMap[currentSelectedSeat].status = newStatus;
            window.seatDataMap[currentSelectedSeat].customerName = newStatus === 'Available' ? "" : cName;
            window.seatDataMap[currentSelectedSeat].phone = newStatus === 'Available' ? "" : cPhone;

            fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ 
                    action: "updateSeat", 
                    seatId: currentSelectedSeat, 
                    newStatus: newStatus,
                    adminName: adminName,
                    customerName: newStatus === 'Available' ? "" : cName,
                    customerPhone: newStatus === 'Available' ? "" : cPhone
                })
            });
        }

        function captureMap() {
            const btn = document.querySelector('.btn-capture');
            const originalText = btn.innerText;
            btn.innerText = "กำลังแคป...";
            
            const area = document.getElementById('seatingArea');
            
            const cloneWrapper = document.createElement('div');
            cloneWrapper.style.position = 'absolute';
            cloneWrapper.style.top = '0';
            cloneWrapper.style.left = '-9999px'; 
            cloneWrapper.style.width = '1800px'; 
            cloneWrapper.style.background = '#0f1115';
            cloneWrapper.style.padding = '40px';
            cloneWrapper.style.zIndex = '-1';
            
            const clone = area.cloneNode(true);
            clone.style.transform = 'none'; 
            clone.style.margin = '0';
            
            cloneWrapper.appendChild(clone);
            document.body.appendChild(cloneWrapper);

            html2canvas(cloneWrapper, { 
                backgroundColor: "#0f1115",
                scale: 2,
                windowWidth: 1800 
            }).then(canvas => {
                let link = document.createElement('a');
                link.download = 'Seating_Map.png';
                link.href = canvas.toDataURL("image/png");
                link.click();
                
                document.body.removeChild(cloneWrapper);
                btn.innerText = originalText;
            }).catch(e => {
                document.body.removeChild(cloneWrapper);
                btn.innerText = originalText;
                alert("เกิดข้อผิดพลาดในการบันทึกภาพ");
            });
        }

        loadSeats();
    </script>
</body>
</html>
