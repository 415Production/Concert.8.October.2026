<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ผังที่นั่งคอนเสิร์ต</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        body { background: #0f1115; color: white; font-family: sans-serif; margin: 0; padding-top: 60px; padding-bottom: 60px; touch-action: manipulation; }
        
        /* Header */
        .header { padding: 0 15px; background: #1a1c23; display: flex; justify-content: space-between; align-items: center; z-index: 20; position: fixed; top: 0; left: 0; width: 100%; box-sizing: border-box; border-bottom: 1px solid #333; height: 60px;}
        .btn-back { background: #4b5563; color: white; padding: 8px 12px; border-radius: 5px; text-decoration: none; font-size: 14px; font-weight: bold;}
        .btn-refresh { background: #2563eb; color: white; padding: 8px 12px; border-radius: 5px; border: none; font-weight: bold; cursor: pointer; font-size: 14px;}
        
        /* Footer แถบสถานะ */
        .footer { background: #1a1c23; display: flex; justify-content: center; align-items: center; z-index: 20; position: fixed; bottom: 0; left: 0; width: 100%; box-sizing: border-box; border-top: 1px solid #333; height: 50px;}
        .legend { display: flex; align-items: center; font-size: 12px; font-weight: bold;}
        .legend span { display: inline-block; width: 12px; height: 12px; margin: 0 5px 0 12px; border-radius: 3px; }
        
        /* Loading Overlay */
        #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: #0f1115; z-index: 50; }

        /* ---------------------------------
           หน้า 1: ภาพรวมโซน (Overview)
        --------------------------------- */
        #view-overview { padding: 15px; max-width: 800px; margin: 0 auto; display: block;}
        
        .overview-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; justify-content: center; align-items: stretch; position: relative; margin-top: 20px;}
        
        /* เวที */
        .stage-container { grid-area: 1 / 3; display: flex; flex-direction: column; align-items: center;}
        .stage-main { width: 100%; height: 40px; background: #ffb74d; border-radius: 6px; display: flex; justify-content: center; align-items: center; color: #000; font-weight: bold; font-size: 14px;}
        .stage-catwalk { width: 40%; height: 50px; background: #ffb74d; border-bottom-left-radius: 6px; border-bottom-right-radius: 6px;}

        /* ปุ่มโซน */
        .zone-card { background: #1f2937; border: 1px solid #374151; border-radius: 8px; padding: 10px 5px; text-align: center; cursor: pointer; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: 0.1s;}
        .zone-card:active { background: #374151; transform: scale(0.95);}
        .zone-card.vip { border: 1px solid #941724; background: #2a1114;}
        .zone-title { font-weight: bold; font-size: 12px; color: white; margin-bottom: 5px;}
        .zone-avail { font-size: 10px; color: #4ade80; background: rgba(0,0,0,0.3); padding: 3px 6px; border-radius: 10px;}
        .zone-avail.full { color: #f87171; }

        /* ---------------------------------
           หน้า 2: เจาะจงโซน (Zone Detail)
        --------------------------------- */
        #view-zone { display: none; padding: 15px; max-width: 800px; margin: 0 auto;}
        
        .zone-header-bar { display: flex; justify-content: space-between; align-items: center; background: #1a1c23; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #333;}
        .zone-header-bar h2 { margin: 0; font-size: 18px; color: #ffb74d;}
        
        .seats-grid { display: grid; gap: 5px; justify-content: center; margin: 0 auto;}
        .grid-15 { grid-template-columns: repeat(15, 1fr); }
        .grid-10 { grid-template-columns: repeat(10, 1fr); }
        
        /* เก้าอี้แบบ Mobile-First */
        .seat { aspect-ratio: 1; min-width: 20px; min-height: 20px; max-width: 40px; max-height: 40px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; display: flex; justify-content: center; align-items: center; transition: 0.1s;}
        .seat:active { transform: scale(0.9); }
        
        .status-Available { background: #374151; color: #9ca3af; }
        .status-Pending { background: #f59e0b; color: #000; }
        .status-Booked { background: #dc2626; color: #fff; }
        
        /* ---------------------------------
           Modal ใส่ข้อมูล
        --------------------------------- */
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1f2937; padding: 20px; border-radius: 12px; z-index: 100; width: 85%; max-width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,0.9); border: 1px solid #4b5563;}
        .modal h3 { margin-top: 0; color: #f3f4f6; text-align: center; font-size: 18px;}
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 13px; color: #9ca3af; margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #4b5563; background: #111827; color: white; box-sizing: border-box; font-size: 16px;}
        .action-btns { display: flex; flex-direction: column; gap: 10px; }
        .modal button { padding: 12px; cursor: pointer; border: none; border-radius: 6px; font-weight: bold; font-size: 15px;}
        .backdrop { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 90;}
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" class="btn-back">← ออกระบบ</a>
        <span id="currentUser" style="color:#ffb74d; font-weight: bold; font-size: 14px;"></span>
        <button class="btn-refresh" onclick="loadSeats()">รีเฟรชข้อมูล</button>
    </div>

    <!-- หน้าจอโหลด -->
    <div id="loadingOverlay">
        <h2 style="color: #888;">กำลังซิงค์ข้อมูล...</h2>
    </div>

    <!-- หน้า 1: ภาพรวมโซน -->
    <div id="view-overview">
        <div class="overview-grid" id="overviewGrid">
            <!-- เวที -->
            <div class="stage-container">
                <div class="stage-main">STAGE</div>
                <div class="stage-catwalk"></div>
            </div>
            <!-- บล็อกโซนต่างๆ จะถูกสร้างที่นี่ -->
        </div>
    </div>

    <!-- หน้า 2: เจาะจงโซน -->
    <div id="view-zone">
        <div class="zone-header-bar">
            <button class="btn-back" onclick="showOverview()">← กลับหน้าผังรวม</button>
            <h2 id="currentZoneTitle">ZONE Name</h2>
        </div>
        <div class="seats-grid" id="zoneSeatsGrid"></div>
    </div>

    <div class="footer">
        <div class="legend">
            <span style="background:#374151;"></span>ว่าง
            <span style="background:#f59e0b;"></span>รอโอน
            <span style="background:#dc2626;"></span>จองแล้ว
        </div>
    </div>

    <!-- Modal จัดการที่นั่ง -->
    <div class="backdrop" id="modalBackdrop" onclick="closeModal()"></div>
    <div class="modal" id="actionModal">
        <h3 id="modalSeatId"></h3>
        <div class="input-group">
            <label>ชื่อลูกค้า</label>
            <input type="text" id="custName" placeholder="กรอกชื่อลูกค้า">
        </div>
        <div class="input-group">
            <label>เบอร์โทรศัพท์</label>
            <input type="text" id="custPhone" placeholder="กรอกเบอร์โทร (ไม่บังคับ)">
        </div>
        <div class="action-btns">
            <button style="background: #dc2626; color: white;" onclick="updateStatus('Booked')">ยืนยันจอง (Booked)</button>
            <button style="background: #f59e0b; color: black;" onclick="updateStatus('Pending')">รอโอน (Pending)</button>
            <button style="background: #374151; color: white;" onclick="updateStatus('Available')">ยกเลิกจอง (ตั้งเป็นว่าง)</button>
            <button style="background: transparent; color: #9ca3af; border: 1px solid #4b5563;" onclick="closeModal()">ปิดหน้าต่าง</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxnh9eh_SQBpkuEVlb42onEWnUNmMtGtujz1yStLz70OSUnDVWKFRvG_sztDXcKhU81/exec"; 
        
        const adminName = sessionStorage.getItem('adminName');
        document.getElementById('currentUser').innerText = adminName && adminName !== "Guest" ? `Admin: ${adminName}` : "โหมดผู้ชม";
        
        let seatDataMap = {}; 
        let zoneData = {}; // เก็บรายการที่นั่งแยกตามโซน
        let currentSelectedSeat = "";
        let currentViewedZone = "";

        const layoutGrid = {
            "ZONE A": "1 / 1", "VIP 1": "1 / 2", "VIP 2": "1 / 4", "ZONE B": "1 / 5",
            "ZONE C": "2 / 1", "VIP 3": "2 / 2", "VIP 4": "2 / 3", "VIP 5": "2 / 4", "ZONE D": "2 / 5",
            "ZONE E": "3 / 1", "VIP 6": "3 / 2", "VIP 7": "3 / 3", "VIP 8": "3 / 4", "ZONE F": "3 / 5",
            "ZONE G": "4 / 1", "ZONE H": "4 / 2", "ZONE I": "4 / 3", "ZONE J": "4 / 4", "ZONE K": "4 / 5",
            "ZONE L": "5 / 1", "ZONE M": "5 / 2", "ZONE N": "5 / 3", "ZONE O": "5 / 4", "ZONE P": "5 / 5",
            "ZONE Q": "6 / 1", "ZONE R": "6 / 2", "ZONE S": "6 / 3", "ZONE T": "6 / 4", "ZONE U": "6 / 5"
        };

        // โหลดข้อมูลทั้งหมดจาก Sheets
        async function loadSeats() {
            document.getElementById('loadingOverlay').style.display = 'flex';
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: "getSeats" })
                });
                const result = await response.json();
                
                if (result.status === "success") {
                    processData(result.data);
                    renderOverview();
                    document.getElementById('loadingOverlay').style.display = 'none';
                } else {
                    alert("ข้อผิดพลาด: " + result.message);
                }
            } catch (e) {
                alert("ไม่สามารถเชื่อมต่อฐานข้อมูลได้");
            }
        }

        // จัดการข้อมูลเข้า Map และแยกโซน
        function processData(data) {
            seatDataMap = {};
            zoneData = {};
            
            data.forEach(row => {
                const id = row[0].toString().trim(); 
                if(!id) return;
                
                seatDataMap[id] = {
                    status: row[3] ? row[3].toString().trim() : "Available",
                    customerName: row[4] ? row[4].toString().trim() : "",
                    phone: row[7] ? row[7].toString().trim() : ""
                };

                const prefix = id.split('-')[0]; 
                if (!zoneData[prefix]) zoneData[prefix] = [];
                zoneData[prefix].push(id);
            });
        }

        // สร้างปุ่มโซนหน้าภาพรวม
        function renderOverview() {
            const overviewGrid = document.getElementById('overviewGrid');
            // ลบโซนเก่าออกให้หมด (ยกเว้นเวที)
            const oldZones = overviewGrid.querySelectorAll('.zone-card');
            oldZones.forEach(z => z.remove());

            Object.keys(zoneData).forEach(zoneName => {
                const isVip = zoneName.includes('VIP');
                
                // คำนวณที่นั่งว่าง
                const totalSeats = zoneData[zoneName].length;
                const availableSeats = zoneData[zoneName].filter(id => seatDataMap[id].status === 'Available').length;
                
                const card = document.createElement('div');
                card.className = `zone-card ${isVip ? 'vip' : ''}`;
                if (layoutGrid[zoneName]) card.style.gridArea = layoutGrid[zoneName];
                
                const statusClass = availableSeats === 0 ? 'full' : '';
                const statusText = availableSeats === 0 ? 'เต็มแล้ว' : `ว่าง ${availableSeats}/${totalSeats}`;

                card.innerHTML = `
                    <div class="zone-title">${zoneName}</div>
                    <div class="zone-avail ${statusClass}">${statusText}</div>
                `;
                
                card.onclick = () => openZoneDetail(zoneName);
                overviewGrid.appendChild(card);
            });
        }

        // สลับหน้าจอ เปิดหน้าเจาะจงโซน
        function openZoneDetail(zoneName) {
            currentViewedZone = zoneName;
            document.getElementById('view-overview').style.display = 'none';
            document.getElementById('view-zone').style.display = 'block';
            document.getElementById('currentZoneTitle').innerText = zoneName;
            
            renderZoneSeats(zoneName);
            window.scrollTo(0, 0); // เลื่อนจอขึ้นบนสุด
        }

        // กลับหน้าภาพรวม (และรีเฟรชข้อมูลจำนวนที่นั่งอัตโนมัติ)
        function showOverview() {
            document.getElementById('view-zone').style.display = 'none';
            document.getElementById('view-overview').style.display = 'block';
            renderOverview(); // อัปเดตตัวเลขที่นั่งว่างทันที
        }

        // วาดเก้าอี้ของโซนที่เลือก
        function renderZoneSeats(zoneName) {
            const grid = document.getElementById('zoneSeatsGrid');
            grid.innerHTML = "";
            
            const seatCount = zoneData[zoneName].length;
            // จัดคอลัมน์อัตโนมัติ
            grid.className = `seats-grid ${seatCount > 50 ? 'grid-15' : 'grid-10'}`;
            
            zoneData[zoneName].forEach(seatId => {
                const info = seatDataMap[seatId];
                const seatNumber = parseInt(seatId.split('-')[1], 10);
                
                const btn = document.createElement('div');
                btn.className = `seat status-${info.status}`; 
                btn.id = `seat-${seatId}`;
                btn.innerText = seatNumber; 
                
                // แอดมินถึงจะกดได้
                if (adminName && adminName !== "Guest") {
                    btn.onclick = () => openModal(seatId);
                }
                grid.appendChild(btn);
            });
        }

        function openModal(seatId) {
            currentSelectedSeat = seatId;
            document.getElementById('modalSeatId').innerText = "ที่นั่ง: " + seatId;
            
            const info = seatDataMap[seatId];
            document.getElementById('custName').value = info.customerName || "";
            document.getElementById('custPhone').value = info.phone || "";
            
            document.getElementById('modalBackdrop').style.display = "block";
            document.getElementById('actionModal').style.display = "block";
        }

        function closeModal() {
            document.getElementById('modalBackdrop').style.display = "none";
            document.getElementById('actionModal').style.display = "none";
        }

        // กดจอง และอัปเดตข้อมูล
        function updateStatus(newStatus) {
            const cName = document.getElementById('custName').value;
            const cPhone = document.getElementById('custPhone').value;

            closeModal();
            
            // อัปเดต UI ทันที
            const seatElem = document.getElementById(`seat-${currentSelectedSeat}`);
            if (seatElem) seatElem.className = `seat status-${newStatus}`;
            
            // อัปเดตข้อมูลในเครื่อง
            seatDataMap[currentSelectedSeat].status = newStatus;
            seatDataMap[currentSelectedSeat].customerName = newStatus === 'Available' ? "" : cName;
            seatDataMap[currentSelectedSeat].phone = newStatus === 'Available' ? "" : cPhone;

            // ส่งข้อมูลไปหลังบ้าน
            fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ 
                    action: "updateSeat", 
                    seatId: currentSelectedSeat, 
                    newStatus: newStatus,
                    adminName: adminName,
                    customerName: newStatus === 'Available' ? "" : cName,
                    customerPhone: newStatus === 'Available' ? "" : cPhone
                })
            });
        }

        // โหลดข้อมูลครั้งแรก
        loadSeats();
    </script>
</body>
</html>
