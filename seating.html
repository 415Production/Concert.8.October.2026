<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ผังที่นั่งคอนเสิร์ต</title>
    
    <!-- นำเข้าฟอนต์ Prompt และ ไอคอนจาก Google -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        /* ตั้งค่าฟอนต์ใหม่ทั้งหมด */
        body { background: #0f1115; color: white; font-family: 'Prompt', sans-serif; margin: 0; padding-top: 60px; padding-bottom: 140px; touch-action: manipulation; }
        
        /* ปรับไอคอนให้อยู่กึ่งกลางกับข้อความ */
        .material-icons { vertical-align: middle; margin-right: 4px; font-size: 18px; margin-bottom: 2px;}

        /* เอฟเฟกต์กระจกฝ้า (Glassmorphism) สำหรับ Header / Footer */
        .glass-panel {
            background: rgba(26, 28, 35, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        /* Header */
        .header { padding: 0 15px; display: flex; justify-content: space-between; align-items: center; z-index: 20; position: fixed; top: 0; left: 0; width: 100%; box-sizing: border-box; height: 60px;}
        .btn-back { background: rgba(75, 85, 99, 0.8); color: white; padding: 8px 12px; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: 500; border: none; cursor: pointer; transition: 0.2s;}
        
        .header-actions { display: flex; gap: 8px; }
        .btn-capture { background: #e50914; color: white; padding: 8px 12px; border-radius: 8px; border: none; font-weight: 500; cursor: pointer; font-size: 13px; transition: 0.2s; box-shadow: 0 4px 10px rgba(229, 9, 20, 0.3);}
        .btn-summary { background: #3b82f6; color: white; padding: 8px 12px; border-radius: 8px; border: none; font-weight: 500; cursor: pointer; font-size: 13px; display: none; transition: 0.2s; box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);}
        
        .btn-back:active, .btn-capture:active, .btn-summary:active { transform: scale(0.95); }

        /* Footer แถบสถานะ */
        .footer { display: flex; justify-content: center; align-items: center; z-index: 20; position: fixed; bottom: 0; left: 0; width: 100%; box-sizing: border-box; height: 50px;}
        .legend { display: flex; align-items: center; font-size: 12px; font-weight: 500;}
        .legend span { display: inline-block; width: 12px; height: 12px; margin: 0 5px 0 12px; border-radius: 3px; box-shadow: inset 0 -2px 0 rgba(0,0,0,0.2);}
        .legend span.l-selected { background: #22c55e; }
        
        /* ปุ่มจองแบบลอยตัว */
        #floatingBookBtn {
            display: none; position: fixed; bottom: 130px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(135deg, #22c55e, #16a34a); color: white;
            padding: 12px 30px; border-radius: 30px; font-size: 15px; font-weight: bold;
            box-shadow: 0 8px 20px rgba(34, 197, 94, 0.4); border: none; z-index: 40; cursor: pointer;
            transition: all 0.2s; font-family: 'Prompt', sans-serif;
        }
        #floatingBookBtn:active { transform: translateX(-50%) scale(0.92); box-shadow: 0 4px 10px rgba(34, 197, 94, 0.4);}

        /* ช่องค้นหาแบบกระจกฝ้า */
        .search-container {
            display: none; position: fixed; bottom: 65px; left: 50%; transform: translateX(-50%);
            gap: 8px; padding: 10px; border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6); z-index: 25; width: 90%; max-width: 450px; box-sizing: border-box;
        }
        .search-container input {
            flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(17, 24, 39, 0.8); color: white; font-size: 14px; font-family: 'Prompt', sans-serif;
            transition: 0.2s;
        }
        .search-container input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3); }
        .search-container button {
            background: #2563eb; color: white; border: none; border-radius: 8px;
            padding: 0 15px; cursor: pointer; font-weight: 500; font-size: 14px; font-family: 'Prompt', sans-serif;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3); transition: 0.2s;
        }
        .search-container button:active { transform: scale(0.95); }

        #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: rgba(15,17,21,0.9); z-index: 999; }

        /* ---------------------------------
           หน้า 1: ภาพรวมทุกโซน (Overview)
        --------------------------------- */
        #view-overview { padding: 15px; margin: 0 auto; display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        
        .overview-layout { 
            display: grid; grid-template-columns: 1.5fr 1fr 1.5fr 1fr 1.5fr; gap: 8px; margin: 0 auto; min-width: 900px; width: 100%; padding-top: 65px;
        }
        
        /* --- เวทีชิ้นเดียว ไร้รอยต่อ มีแสงเรือง (Seamless T-Shape Stage) --- */
        .stage-container { 
            grid-area: 1 / 3; position: relative; display: flex; flex-direction: column; align-items: center; height: 100%; 
            /* ใส่แสง Glow ให้เรืองแสงออกมาจากตัวเวทีรวมกันทั้งหมด */
            filter: drop-shadow(0 8px 15px rgba(255, 183, 77, 0.35)); 
        }
        .stage-main { 
            position: absolute; bottom: 100%; width: 165%; height: 55px; 
            /* ไล่สีจากเหลืองลงมาส้ม */
            background: linear-gradient(to bottom, #ffcc80, #ffb74d); 
            border-radius: 8px 8px 0 0; /* มนแค่ด้านบน ด้านล่างตัดตรงให้เชื่อมกับ Catwalk */
            display: flex; justify-content: center; align-items: center; 
            color: #000; font-weight: bold; font-size: 15px; z-index: 5; 
        }
        .stage-catwalk { 
            width: 45%; height: 100%; 
            /* ไล่สีจากส้มลงมาส้มเข้ม (ต่อจาก Stage Main) */
            background: linear-gradient(to bottom, #ffb74d, #f57c00); 
            border-radius: 0 0 8px 8px; /* ตัดตรงด้านบน มนด้านล่าง */
            position: relative; z-index: 4;
        }

        .zone-box { 
            background: #1a1c23; border: 1px solid rgba(255,255,255,0.05); border-radius: 8px; 
            padding: 8px; cursor: pointer; transition: 0.2s; box-sizing: border-box; width: 100%; overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .zone-box:active { background: #2d3748; transform: scale(0.98); }
        .zone-box.vip { border: 1px solid #941724; background: #221013; box-shadow: 0 4px 10px rgba(148, 23, 36, 0.2);}
        
        .zone-box-title { text-align: center; font-size: 11px; font-weight: bold; margin-bottom: 8px; color: #fff; background: linear-gradient(90deg, #b91c1c, #991b1b); padding: 4px; border-radius: 4px; text-shadow: 0 1px 2px rgba(0,0,0,0.5);}
        .zone-box-title.normal { background: linear-gradient(90deg, #374151, #1f2937); }
        
        .mini-seats-grid { display: grid; gap: 2px; width: 100%; container-type: inline-size; }
        .grid-mini-10 { grid-template-columns: repeat(10, 1fr); }
        .grid-mini-15 { grid-template-columns: repeat(15, 1fr); }
        
        .mini-seat { 
            width: 100%; aspect-ratio: 1; border-radius: 1px; line-height: 1; font-weight: 500; 
            display: flex; justify-content: center; align-items: center; box-sizing: border-box; overflow: hidden;
        }

        .grid-mini-10 .mini-seat { font-size: clamp(6px, 4.5cqw, 16px); }
        .grid-mini-15 .mini-seat { font-size: clamp(5.5px, 3.2cqw, 14px); }

        /* ---------------------------------
           หน้า 2: เจาะจงโซน (Zone Detail)
        --------------------------------- */
        #view-zone { display: none; padding: 15px; max-width: 100%; margin: 0 auto; box-sizing: border-box;}
        
        .zone-header-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; border-radius: 12px; margin-bottom: 20px; }
        .zone-header-bar h2 { margin: 0; font-size: 18px; color: #ffb74d; font-weight: bold;}
        
        .zone-scroll-container { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 20px;}
        .seats-grid { display: grid; justify-content: center; margin: 0 auto; padding: 0 10px;}
        .grid-15 { grid-template-columns: repeat(15, 34px); gap: 8px; min-width: 630px; }
        .grid-10 { grid-template-columns: repeat(10, 40px); gap: 10px; min-width: 480px; }
        
        /* เก้าอี้แบบมีมิติ 3D (Shadows & Gradients) */
        .seat { 
            aspect-ratio: 1; width: 100%; border-radius: 6px; cursor: pointer; 
            font-size: 12px; font-weight: 600; display: flex; justify-content: center; align-items: center; 
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            /* ใส่เงาด้านล่างและแสงตกกระทบด้านบน */
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), inset 0 -3px 0 rgba(0,0,0,0.3), 0 3px 5px rgba(0,0,0,0.4);
        }
        /* เวลากดให้เก้าอี้ยุบตัวลงไปอย่างนุ่มนวล */
        .seat:active { transform: translateY(2px) scale(0.95); box-shadow: inset 0 2px 4px rgba(0,0,0,0.4); }
        
        .status-Available { background: #374151; color: #d1d5db; }
        .status-Pending { background: #f59e0b; color: #000; text-shadow: 0 1px 1px rgba(255,255,255,0.4);}
        .status-Booked { background: #dc2626; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.5);}
        .status-Selected { background: #22c55e !important; color: #fff !important; text-shadow: 0 1px 2px rgba(0,0,0,0.5);}
        
        /* Animations นุ่มนวลสำหรับหน้าต่าง Modal */
        @keyframes popIn {
            0% { opacity: 0; transform: translate(-50%, -45%) scale(0.95); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Modal & Pop-up (Glassmorphism) */
        .modal { 
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            background: rgba(31, 41, 55, 0.95); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            padding: 24px; border-radius: 16px; z-index: 100; width: 85%; max-width: 350px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.1);
        }
        .modal.show { animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        .modal h3 { margin-top: 0; color: #f3f4f6; text-align: center; font-size: 18px; margin-bottom: 20px;}
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 13px; color: #9ca3af; margin-bottom: 6px; }
        .input-group input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(17, 24, 39, 0.8); color: white; box-sizing: border-box; font-size: 15px; font-family: 'Prompt', sans-serif; transition: 0.2s;}
        .input-group input:focus { outline: none; border-color: #ffb74d; box-shadow: 0 0 0 2px rgba(255, 183, 77, 0.2);}
        .action-btns { display: flex; flex-direction: column; gap: 10px; }
        .modal button { padding: 12px; cursor: pointer; border: none; border-radius: 8px; font-weight: 500; font-size: 14px; font-family: 'Prompt', sans-serif; transition: 0.2s;}
        .modal button:active { transform: scale(0.97); }
        .backdrop { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); z-index: 90;}
        .backdrop.show { animation: fadeIn 0.2s ease-out forwards; }
    </style>
</head>
<body>

    <div class="header glass-panel">
        <button class="btn-back" onclick="showOverview()"><span class="material-icons">arrow_back</span> ออกระบบ</button>
        <div class="header-actions">
            <button class="btn-summary" id="btnSummary" onclick="showSummaryModal()"><span class="material-icons">analytics</span> ภาพรวม</button>
            <button class="btn-capture" id="btnCapture" onclick="handleCapture()"><span class="material-icons">camera_alt</span> แคปผังรวม</button>
        </div>
    </div>

    <!-- ปุ่มจองแบบลอยตัว -->
    <button id="floatingBookBtn" onclick="openBulkBookModal()"></button>

    <div class="search-container glass-panel" id="searchContainer">
        <input type="text" id="searchInput" placeholder="ค้นหาด้วยชื่อ หรือ เบอร์โทร...">
        <button onclick="searchSeat()"><span class="material-icons">search</span> ค้นหา</button>
    </div>

    <div id="loadingOverlay">
        <div style="text-align: center;">
            <span class="material-icons" style="font-size: 40px; color: #ffb74d; margin-bottom: 10px; animation: spin 1s linear infinite;">autorenew</span>
            <h3 style="color: #ddd; margin:0;" id="loadingText">กำลังโหลดข้อมูล...</h3>
        </div>
    </div>
    <style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>

    <div id="view-overview">
        <div class="overview-layout" id="overviewLayout">
            <div class="stage-container">
                <div class="stage-main">STAGE</div>
                <div class="stage-catwalk"></div>
            </div>
        </div>
    </div>

    <div id="view-zone">
        <div class="zone-header-bar glass-panel">
            <button class="btn-back" onclick="showOverview()"><span class="material-icons">arrow_back</span> ภาพรวม</button>
            <h2 id="currentZoneTitle">ZONE Name</h2>
        </div>
        <div class="zone-scroll-container">
            <div class="seats-grid" id="zoneSeatsGrid"></div>
        </div>
    </div>

    <div class="footer glass-panel">
        <div class="legend">
            <span style="background:#374151;"></span>ว่าง
            <span class="l-selected" id="legendSelected" style="display:none;"></span><span id="legendText" style="display:none;">เลือกอยู่</span>
            <span style="background:#f59e0b;"></span>รอโอน
            <span style="background:#dc2626;"></span>จองแล้ว
        </div>
    </div>

    <div class="backdrop" id="modalBackdrop" onclick="closeModal()"></div>
    
    <div class="modal" id="actionModal">
        <h3 id="modalSeatId"></h3>
        <div class="input-group"><label>ชื่อลูกค้า</label><input type="text" id="custName" placeholder="กรอกชื่อลูกค้า"></div>
        <div class="input-group"><label>เบอร์โทรศัพท์ (10 หลัก)</label><input type="tel" id="custPhone" placeholder="กรอกเบอร์โทร 10 หลัก" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 10)"></div>
        <div class="action-btns">
            <button style="background: #dc2626; color: white;" onclick="updateSingleStatus('Booked')"><span class="material-icons">check_circle</span> บันทึกเป็น จองแล้ว</button>
            <button style="background: #f59e0b; color: black;" onclick="updateSingleStatus('Pending')"><span class="material-icons">schedule</span> บันทึกเป็น รอโอน</button>
            <button style="background: #374151; color: white;" onclick="updateSingleStatus('Available')"><span class="material-icons">cancel</span> ยกเลิกจอง (ว่าง)</button>
            <button style="background: transparent; color: #9ca3af; border: 1px solid rgba(255,255,255,0.2);" onclick="closeModal()">ปิด</button>
        </div>
    </div>

    <div class="modal" id="bulkBookModal">
        <h3 style="color:#22c55e;" id="bulkModalTitle"><span class="material-icons">shopping_cart_checkout</span> ดำเนินการจองที่นั่ง</h3>
        <div style="font-size:13px; color:#9ca3af; margin-bottom:15px; text-align:center;" id="bulkSeatsList"></div>
        <div class="input-group"><label>ชื่อลูกค้า</label><input type="text" id="bulkCustName" placeholder="กรอกชื่อลูกค้า"></div>
        <div class="input-group"><label>เบอร์โทรศัพท์ (บังคับ 10 หลัก)</label><input type="tel" id="bulkCustPhone" placeholder="ตัวอย่าง: 0812345678" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 10)"></div>
        <div class="action-btns">
            <button style="background: #dc2626; color: white;" onclick="submitBulkBooking('Booked')"><span class="material-icons">check_circle</span> ยืนยันจอง (Booked)</button>
            <button style="background: #f59e0b; color: black;" onclick="submitBulkBooking('Pending')"><span class="material-icons">schedule</span> รอโอน (Pending)</button>
            <button style="background: transparent; color: #9ca3af; border: 1px solid rgba(255,255,255,0.2);" onclick="closeModal()">ยกเลิก</button>
        </div>
    </div>

    <div class="modal" id="infoModal">
        <h3 id="infoModalTitle" style="color: #4ade80;">ผลการค้นหา</h3>
        <div id="infoResultMsg" style="margin: 15px 0; font-size: 15px; line-height: 1.6; text-align: center;"></div>
        <button style="width: 100%; background: #374151; color: white; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.3);" onclick="closeModal()">ปิดหน้าต่าง</button>
    </div>

    <div class="modal" id="summaryModal">
        <h3 style="color: #ffb74d;"><span class="material-icons">analytics</span> ภาพรวมการจองทั้งหมด</h3>
        <div style="text-align:left; background:rgba(17,24,39,0.5); padding:15px; border-radius:12px; border:1px solid rgba(255,255,255,0.1); margin-top:15px;">
            <div style="margin-bottom:12px; color:#9ca3af; display: flex; justify-content: space-between;"><span>VIP ขายแล้ว:</span> <span style="color:white; font-weight:bold;" id="sumVip">0/0</span></div>
            <div style="margin-bottom:12px; color:#9ca3af; display: flex; justify-content: space-between;"><span>ธรรมดา ขายแล้ว:</span> <span style="color:white; font-weight:bold;" id="sumNorm">0/0</span></div>
            <hr style="border:0; border-top:1px solid rgba(255,255,255,0.1); margin:12px 0;">
            <div style="color:#4ade80; font-weight:bold; font-size:16px; display: flex; justify-content: space-between;"><span>รายรับรวม:</span> <span id="sumRev">0 บาท</span></div>
        </div>
        <div class="action-btns" style="margin-top:20px;">
            <button style="background: #374151; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.3);" onclick="closeModal()">ปิด</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxnh9eh_SQBpkuEVlb42onEWnUNmMtGtujz1yStLz70OSUnDVWKFRvG_sztDXcKhU81/exec"; 
        
        const adminName = sessionStorage.getItem('adminName');
        const isGuest = !adminName || adminName === "Guest";
        
        let selectedSeatsToBook = [];
        let seatDataMap = {}; 
        let zoneData = {}; 
        let currentSelectedSeat = "";
        let currentViewedZone = "";

        const layoutGrid = {
            "ZONE A": "1 / 1", "VIP 1": "1 / 2", "VIP 2": "1 / 4", "ZONE B": "1 / 5",
            "ZONE C": "2 / 1", "VIP 3": "2 / 2", "VIP 4": "2 / 3", "VIP 5": "2 / 4", "ZONE D": "2 / 5",
            "ZONE E": "3 / 1", "VIP 6": "3 / 2", "VIP 7": "3 / 3", "VIP 8": "3 / 4", "ZONE F": "3 / 5",
            "ZONE G": "4 / 1", "ZONE H": "4 / 2", "ZONE I": "4 / 3", "ZONE J": "4 / 4", "ZONE K": "4 / 5",
            "ZONE L": "5 / 1", "ZONE M": "5 / 2", "ZONE N": "5 / 3", "ZONE O": "5 / 4", "ZONE P": "5 / 5",
            "ZONE Q": "6 / 1", "ZONE R": "6 / 2", "ZONE S": "6 / 3", "ZONE T": "6 / 4", "ZONE U": "6 / 5"
        };

        // แสดงแถบค้นหาให้ทุกคนในหน้า Overview ทันทีที่โหลด
        document.getElementById('searchContainer').style.display = "flex";

        if (!isGuest) {
            document.getElementById('btnSummary').style.display = "block";
            document.getElementById('legendSelected').style.display = "inline-block";
            document.getElementById('legendText').style.display = "inline-block";
        }

        async function loadSeats() {
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: "getSeats" })
                });
                const result = await response.json();
                
                if (result.status === "success") {
                    document.getElementById('loadingOverlay').style.display = 'none';
                    processData(result.data);
                    renderOverview();
                } else {
                    document.getElementById('loadingText').innerText = `ข้อผิดพลาด: ${result.message}`;
                }
            } catch (e) {
                document.getElementById('loadingText').innerText = `ไม่สามารถเชื่อมต่อฐานข้อมูลได้`;
            }
        }

        function processData(data) {
            seatDataMap = {};
            zoneData = {};
            
            data.forEach(row => {
                const id = row[0].toString().trim(); 
                if(!id) return;
                
                seatDataMap[id] = {
                    status: row[3] ? row[3].toString().trim() : "Available",
                    customerName: row[4] ? row[4].toString().trim() : "",
                    phone: row[7] ? row[7].toString().trim() : ""
                };

                const prefix = id.split('-')[0]; 
                if (!zoneData[prefix]) zoneData[prefix] = [];
                zoneData[prefix].push(id);
            });
        }

        // --- ระบบ Sync ข้อมูลเบื้องหลัง (Background Sync) ---
        async function syncDataBackground() {
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: "getSeats" })
                });
                const result = await response.json();
                
                if (result.status === "success") {
                    let selectionChanged = false;

                    result.data.forEach(row => {
                        const id = row[0].toString().trim(); 
                        if(!id) return;
                        
                        const newStatus = row[3] ? row[3].toString().trim() : "Available";
                        
                        if (seatDataMap[id]) {
                            seatDataMap[id].status = newStatus;
                            seatDataMap[id].customerName = row[4] ? row[4].toString().trim() : "";
                            seatDataMap[id].phone = row[7] ? row[7].toString().trim() : "";
                            
                            const isSelected = selectedSeatsToBook.includes(id);
                            if (isSelected && newStatus !== 'Available') {
                                selectedSeatsToBook = selectedSeatsToBook.filter(s => s !== id);
                                selectionChanged = true;
                            }

                            const seatBtn = document.getElementById(`seat-${id}`);
                            if (seatBtn) {
                                const currentlySelected = selectedSeatsToBook.includes(id);
                                seatBtn.className = `seat status-${currentlySelected ? 'Selected' : newStatus}`;
                            }
                            
                            const miniSeat = document.getElementById(`mini-seat-${id}`);
                            if (miniSeat) {
                                const currentlySelected = selectedSeatsToBook.includes(id);
                                miniSeat.className = `mini-seat status-${currentlySelected ? 'Selected' : newStatus}`;
                            }
                        }
                    });

                    if (selectionChanged) {
                        updateFloatingBtn();
                    }
                }
            } catch (e) {
                // Ignore sync errors silently
            }
        }
        
        setInterval(syncDataBackground, 15000);

        function renderOverview() {
            const overviewLayout = document.getElementById('overviewLayout');
            const oldBoxes = overviewLayout.querySelectorAll('.zone-box');
            oldBoxes.forEach(b => b.remove());

            Object.keys(zoneData).forEach(zoneName => {
                const isVip = zoneName.includes('VIP');
                
                const box = document.createElement('div');
                box.className = `zone-box ${isVip ? 'vip' : ''}`;
                if (layoutGrid[zoneName]) box.style.gridArea = layoutGrid[zoneName];
                
                const titleDiv = document.createElement('div');
                titleDiv.className = `zone-box-title ${isVip ? '' : 'normal'}`;
                titleDiv.innerText = zoneName;
                box.appendChild(titleDiv);

                const miniGrid = document.createElement('div');
                const seatCount = zoneData[zoneName].length;
                miniGrid.className = `mini-seats-grid ${seatCount > 50 ? 'grid-mini-15' : 'grid-mini-10'}`;

                zoneData[zoneName].forEach(seatId => {
                    const info = seatDataMap[seatId];
                    const seatNumber = parseInt(seatId.split('-')[1], 10);
                    
                    const miniSeat = document.createElement('div');
                    miniSeat.id = `mini-seat-${seatId}`;
                    const isSelected = selectedSeatsToBook.includes(seatId);
                    miniSeat.className = `mini-seat status-${isSelected ? 'Selected' : info.status}`;
                    miniSeat.innerText = seatNumber;
                    miniGrid.appendChild(miniSeat);
                });

                box.appendChild(miniGrid);
                box.onclick = () => openZoneDetail(zoneName);
                overviewLayout.appendChild(box);
            });
        }

        function openZoneDetail(zoneName) {
            currentViewedZone = zoneName;
            document.getElementById('view-overview').style.display = 'none';
            document.getElementById('view-zone').style.display = 'block';
            document.getElementById('currentZoneTitle').innerText = zoneName;
            document.getElementById('btnCapture').innerHTML = '<span class="material-icons">camera_alt</span> แคปโซนนี้';
            
            // ซ่อนแถบค้นหาเมื่อเข้าไปดูเจาะจงโซน
            document.getElementById('searchContainer').style.display = "none";
            
            renderZoneSeats(zoneName);
            window.scrollTo(0, 0);
        }

        function showOverview() {
            document.getElementById('view-zone').style.display = 'none';
            document.getElementById('view-overview').style.display = 'block';
            document.getElementById('btnCapture').innerHTML = '<span class="material-icons">camera_alt</span> แคปผังรวม';
            
            // แสดงแถบค้นหาเมื่อกลับมาหน้าภาพรวม
            document.getElementById('searchContainer').style.display = "flex";
            
            renderOverview();
        }

        function renderZoneSeats(zoneName) {
            const grid = document.getElementById('zoneSeatsGrid');
            grid.innerHTML = "";
            
            const seatCount = zoneData[zoneName].length;
            grid.className = `seats-grid ${seatCount > 50 ? 'grid-15' : 'grid-10'}`;
            
            zoneData[zoneName].forEach(seatId => {
                const info = seatDataMap[seatId];
                const seatNumber = parseInt(seatId.split('-')[1], 10);
                
                const btn = document.createElement('div');
                const isSelected = selectedSeatsToBook.includes(seatId);
                btn.className = `seat status-${isSelected ? 'Selected' : info.status}`; 
                btn.id = `seat-${seatId}`;
                btn.innerText = seatNumber; 
                
                btn.onclick = () => handleSeatClick(seatId);
                grid.appendChild(btn);
            });
        }

        function handleSeatClick(seatId) {
            const info = seatDataMap[seatId];

            if (isGuest) {
                showSeatInfoReadOnly(seatId, info);
            } else {
                if (info.status === 'Available' || selectedSeatsToBook.includes(seatId)) {
                    toggleSeatSelection(seatId);
                } else {
                    openSingleEditModal(seatId, info);
                }
            }
        }

        function toggleSeatSelection(seatId) {
            const idx = selectedSeatsToBook.indexOf(seatId);
            const btn = document.getElementById(`seat-${seatId}`);
            const miniBtn = document.getElementById(`mini-seat-${seatId}`);
            
            if (idx > -1) {
                selectedSeatsToBook.splice(idx, 1);
                if(btn) btn.className = 'seat status-Available';
                if(miniBtn) miniBtn.className = 'mini-seat status-Available';
            } else {
                selectedSeatsToBook.push(seatId);
                if(btn) btn.className = 'seat status-Selected';
                if(miniBtn) miniBtn.className = 'mini-seat status-Selected';
            }
            updateFloatingBtn();
        }

        function updateFloatingBtn() {
            const btn = document.getElementById('floatingBookBtn');
            if (selectedSeatsToBook.length > 0) {
                btn.style.display = 'block';
                btn.innerHTML = `<span class="material-icons">check_circle</span> ดำเนินการจอง (${selectedSeatsToBook.length} ที่นั่ง)`;
            } else {
                btn.style.display = 'none';
            }
        }

        function openModalWithAnim(modalId) {
            document.getElementById('modalBackdrop').style.display = "block";
            document.getElementById('modalBackdrop').classList.add("show");
            const modal = document.getElementById(modalId);
            modal.style.display = "block";
            modal.classList.add("show");
        }

        function openBulkBookModal() {
            document.getElementById('bulkCustName').value = "";
            document.getElementById('bulkCustPhone').value = "";
            document.getElementById('bulkSeatsList').innerText = `ที่นั่งที่เลือก: ${selectedSeatsToBook.join(', ')}`;
            openModalWithAnim('bulkBookModal');
        }

        async function submitBulkBooking(newStatus) {
            const cName = document.getElementById('bulkCustName').value.trim();
            const cPhone = document.getElementById('bulkCustPhone').value.trim();

            if (!cName) {
                alert("กรุณากรอกชื่อลูกค้า");
                return;
            }
            if (!/^0\d{9}$/.test(cPhone)) {
                alert("กรุณากรอกเบอร์โทรศัพท์ให้ถูกต้อง\n(ตัวเลข 10 หลัก ขึ้นต้นด้วย 0)");
                return;
            }

            closeModal();
            document.getElementById('loadingOverlay').style.display = 'flex';
            document.getElementById('loadingText').innerText = "กำลังบันทึกการจอง...";

            const bookedSeatsList = [...selectedSeatsToBook];

            for (let seatId of bookedSeatsList) {
                seatDataMap[seatId].status = newStatus;
                seatDataMap[seatId].customerName = cName;
                seatDataMap[seatId].phone = cPhone;
            }

            const requests = bookedSeatsList.map(seatId => {
                return fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ 
                        action: "updateSeat", 
                        seatId: seatId, 
                        newStatus: newStatus,
                        adminName: adminName,
                        customerName: cName,
                        customerPhone: cPhone
                    })
                });
            });

            try {
                await Promise.all(requests);
            } catch (e) {
                console.error("Error saving some seats", e);
            }

            selectedSeatsToBook = [];
            updateFloatingBtn();
            
            document.getElementById('loadingOverlay').style.display = 'none';
            if (currentViewedZone !== "") renderZoneSeats(currentViewedZone); 
            else renderOverview();

            showSuccessModal(cName, cPhone, bookedSeatsList);
        }

        function showSuccessModal(name, phone, seatsArr) {
            let zoneMap = {};
            seatsArr.forEach(s => {
                let parts = s.split('-');
                let z = parts[0].trim();
                let num = parts[1].trim();
                if(!zoneMap[z]) zoneMap[z] = [];
                zoneMap[z].push(num);
            });
            let seatStr = Object.keys(zoneMap).map(z => `<b>${z}</b>: ${zoneMap[z].join(', ')}`).join('<br>');

            const modalTitle = document.getElementById('infoModalTitle');
            const resultMsg = document.getElementById('infoResultMsg');
            
            modalTitle.innerHTML = `<span class="material-icons">task_alt</span> การจองสำเร็จ!`;
            modalTitle.style.color = "#4ade80";
            
            resultMsg.innerHTML = `
                <div style="text-align:left; background:rgba(17, 24, 39, 0.5); padding:15px; border-radius:12px; border:1px solid rgba(255,255,255,0.1); font-size:14px;">
                    <div style="margin-bottom:8px; color:#9ca3af;">ชื่อผู้จอง: <span style="color:white; font-weight:bold; float:right;">${name}</span></div>
                    <div style="margin-bottom:12px; color:#9ca3af;">เบอร์โทร: <span style="color:white; font-weight:bold; float:right;">${phone}</span></div>
                    <hr style="border:0; border-top:1px solid rgba(255,255,255,0.1); margin:12px 0;">
                    <div style="color:#9ca3af;">ที่นั่ง:<br><span style="color:#ffb74d; font-weight:bold; line-height:1.6; display:block; margin-top:5px; font-size:16px;">${seatStr}</span></div>
                </div>
            `;
            openModalWithAnim('infoModal');
        }

        function openSingleEditModal(seatId, info) {
            currentSelectedSeat = seatId;
            document.getElementById('modalSeatId').innerText = "แก้ไขที่นั่ง: " + seatId;
            document.getElementById('custName').value = info.customerName || "";
            document.getElementById('custPhone').value = info.phone || "";
            openModalWithAnim('actionModal');
        }

        async function updateSingleStatus(newStatus) {
            const cName = document.getElementById('custName').value.trim();
            const cPhone = document.getElementById('custPhone').value.trim();

            if (newStatus !== 'Available' && !/^0\d{9}$/.test(cPhone)) {
                alert("กรุณากรอกเบอร์โทรศัพท์ให้ถูกต้อง\n(ตัวเลข 10 หลัก ขึ้นต้นด้วย 0)");
                return;
            }

            closeModal();
            
            const seatElem = document.getElementById(`seat-${currentSelectedSeat}`);
            if (seatElem) seatElem.className = `seat status-${newStatus}`;
            
            seatDataMap[currentSelectedSeat].status = newStatus;
            seatDataMap[currentSelectedSeat].customerName = newStatus === 'Available' ? "" : cName;
            seatDataMap[currentSelectedSeat].phone = newStatus === 'Available' ? "" : cPhone;

            fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ 
                    action: "updateSeat", 
                    seatId: currentSelectedSeat, 
                    newStatus: newStatus,
                    adminName: adminName,
                    customerName: newStatus === 'Available' ? "" : cName,
                    customerPhone: newStatus === 'Available' ? "" : cPhone
                })
            });
        }

        function showSeatInfoReadOnly(seatId, info) {
            const modalTitle = document.getElementById('infoModalTitle');
            const resultMsg = document.getElementById('infoResultMsg');
            
            modalTitle.innerHTML = `<span class="material-icons">info</span> ข้อมูลที่นั่ง`;
            modalTitle.style.color = "#ffb74d";
            
            if (info.status === 'Available') {
                resultMsg.innerHTML = `<div style="font-size:20px; font-weight:bold;">${seatId}</div><div style="color:#4ade80; margin-top:10px; font-weight:bold;"><span class="material-icons">check_circle</span> สถานะ: ว่าง</div>`;
            } else {
                const statusText = info.status === 'Booked' ? '<span style="color:#dc2626;">จองแล้ว</span>' : '<span style="color:#f59e0b;">รอโอน</span>';
                resultMsg.innerHTML = 
                    `<div style="font-size:20px; margin-bottom:15px; font-weight:bold; color:#ffb74d;">${seatId}</div>
                     <div style="text-align:left; background:rgba(17, 24, 39, 0.5); padding:15px; border-radius:12px; border:1px solid rgba(255,255,255,0.1);">
                        <div style="margin-bottom:8px; color:#9ca3af; display:flex; justify-content:space-between;"><span>สถานะ:</span> <b>${statusText}</b></div>
                        <div style="margin-bottom:8px; color:#9ca3af; display:flex; justify-content:space-between;"><span>ชื่อลูกค้า:</span> <span style="color:white; font-weight:bold;">${info.customerName || "-"}</span></div>
                        <div style="color:#9ca3af; display:flex; justify-content:space-between;"><span>เบอร์โทร:</span> <span style="color:white; font-weight:bold;">${info.phone || "-"}</span></div>
                     </div>`;
            }
            openModalWithAnim('infoModal');
        }

        function searchSeat() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            if(!query) {
                alert("กรุณากรอกชื่อหรือเบอร์โทรที่ต้องการค้นหา");
                return;
            }

            let foundSeats = [];
            let foundName = "";
            let foundPhone = "";

            Object.keys(seatDataMap).forEach(seatId => {
                const info = seatDataMap[seatId];
                if (info.status !== 'Available') {
                    const cName = (info.customerName || "").toLowerCase();
                    const cPhone = (info.phone || "").toLowerCase();
                    
                    if (cName.includes(query) || cPhone.includes(query)) {
                        foundSeats.push(seatId);
                        if(!foundName) foundName = info.customerName; 
                        if(!foundPhone) foundPhone = info.phone; 
                    }
                }
            });

            const modalTitle = document.getElementById('infoModalTitle');
            const resultMsg = document.getElementById('infoResultMsg');
            
            if (foundSeats.length > 0) {
                modalTitle.innerHTML = `<span class="material-icons">search</span> พบข้อมูล`;
                modalTitle.style.color = "#4ade80";
                resultMsg.innerHTML = 
                    `<div style="margin-bottom:10px; font-size:16px;">การจองของคุณ <b style="color:white;">${foundName}</b></div>
                     <div style="margin-bottom:15px; color:#9ca3af; font-size:14px;">📞 ${foundPhone || "-"}</div>
                     <div style="background:rgba(17, 24, 39, 0.5); padding:15px; border-radius:12px; border:1px solid rgba(255,255,255,0.1);">
                        <div style="color:#9ca3af; margin-bottom:5px;">ที่นั่งทั้งหมด:</div>
                        <div style="color:#4ade80; font-size:16px; font-weight:bold;">${foundSeats.join(', ')}</div>
                     </div>`;
            } else {
                modalTitle.innerHTML = `<span class="material-icons">error_outline</span> ไม่พบข้อมูล`;
                modalTitle.style.color = "#f87171";
                resultMsg.innerHTML = `<span style="color:#f87171;">ไม่พบข้อมูลการจองที่ตรงกับคำค้นหา</span>`;
            }
            openModalWithAnim('infoModal');
        }

        function showSummaryModal() {
            let vipTotal = 0, vipSold = 0;
            let normTotal = 0, normSold = 0;

            Object.keys(seatDataMap).forEach(seatId => {
                const info = seatDataMap[seatId];
                if (seatId.includes('VIP')) {
                    vipTotal++;
                    if (info.status === 'Booked') vipSold++;
                } else {
                    normTotal++;
                    if (info.status === 'Booked') normSold++;
                }
            });

            const rev = (vipSold * 899) + (normSold * 399);

            document.getElementById('sumVip').innerText = `${vipSold}/${vipTotal}`;
            document.getElementById('sumNorm').innerText = `${normSold}/${normTotal}`;
            document.getElementById('sumRev').innerText = `${rev.toLocaleString()} บาท`;
            
            openModalWithAnim('summaryModal');
        }

        function closeModal() {
            const modals = document.querySelectorAll('.modal');
            modals.forEach(m => { m.classList.remove('show'); m.style.display = 'none'; });
            const backdrop = document.getElementById('modalBackdrop');
            backdrop.classList.remove('show');
            backdrop.style.display = 'none';
        }

        function handleCapture() {
            const searchBox = document.getElementById('searchContainer');
            if(searchBox) searchBox.style.display = "none";

            const isOverviewVisible = document.getElementById('view-overview').style.display !== 'none';
            if (isOverviewVisible) {
                captureOverviewMap();
            } else {
                captureSingleZoneMap();
            }
        }

        function captureOverviewMap() {
            const btn = document.getElementById('btnCapture');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="material-icons">hourglass_top</span> กำลังแคป...';
            
            const layout = document.getElementById('overviewLayout');
            
            const cloneWrapper = document.createElement('div');
            cloneWrapper.style.position = 'absolute';
            cloneWrapper.style.top = '0';
            cloneWrapper.style.left = '-9999px'; 
            cloneWrapper.style.width = 'max-content'; 
            cloneWrapper.style.background = '#0f1115';
            cloneWrapper.style.padding = '30px';
            cloneWrapper.style.zIndex = '-1';
            
            const clone = layout.cloneNode(true);
            cloneWrapper.appendChild(clone);
            document.body.appendChild(cloneWrapper);

            const exactWidth = clone.scrollWidth + 60;

            html2canvas(cloneWrapper, { 
                backgroundColor: "#0f1115",
                scale: 2.5,
                windowWidth: exactWidth 
            }).then(canvas => {
                let link = document.createElement('a');
                link.download = 'Overview_Seating_Map.png';
                link.href = canvas.toDataURL("image/png");
                link.click();
                
                document.body.removeChild(cloneWrapper);
                btn.innerHTML = originalText;
                document.getElementById('searchContainer').style.display = "flex"; 
            }).catch(e => {
                document.body.removeChild(cloneWrapper);
                btn.innerHTML = originalText;
                document.getElementById('searchContainer').style.display = "flex";
                alert("เกิดข้อผิดพลาดในการบันทึกภาพ");
            });
        }

        function captureSingleZoneMap() {
            const btn = document.getElementById('btnCapture');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="material-icons">hourglass_top</span> กำลังแคป...';
            
            const zoneContainer = document.getElementById('zoneSeatsGrid');
            
            const cloneWrapper = document.createElement('div');
            cloneWrapper.style.position = 'absolute';
            cloneWrapper.style.top = '0';
            cloneWrapper.style.left = '-9999px'; 
            cloneWrapper.style.width = 'max-content'; 
            cloneWrapper.style.background = '#0f1115';
            cloneWrapper.style.padding = '40px';
            cloneWrapper.style.zIndex = '-1';
            
            const titleHeader = document.createElement('h2');
            titleHeader.innerText = currentViewedZone;
            titleHeader.style.color = '#ffb74d';
            titleHeader.style.textAlign = 'center';
            titleHeader.style.fontFamily = "'Prompt', sans-serif";
            titleHeader.style.marginBottom = '25px';
            titleHeader.style.fontSize = '24px';
            cloneWrapper.appendChild(titleHeader);

            const clone = zoneContainer.cloneNode(true);
            clone.style.margin = '0 auto';
            cloneWrapper.appendChild(clone);
            document.body.appendChild(cloneWrapper);

            const exactWidth = clone.scrollWidth + 80;

            html2canvas(cloneWrapper, { 
                backgroundColor: "#0f1115",
                scale: 2.5,
                windowWidth: exactWidth 
            }).then(canvas => {
                let link = document.createElement('a');
                link.download = `${currentViewedZone}_Map.png`;
                link.href = canvas.toDataURL("image/png");
                link.click();
                
                document.body.removeChild(cloneWrapper);
                btn.innerHTML = originalText;
            }).catch(e => {
                document.body.removeChild(cloneWrapper);
                btn.innerHTML = originalText;
                alert("เกิดข้อผิดพลาดในการบันทึกภาพโซน");
            });
        }

        loadSeats();
    </script>
</body>
