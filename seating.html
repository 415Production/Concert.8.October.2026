<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ผังที่นั่งคอนเสิร์ต</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        body { background: #0f1115; color: white; font-family: sans-serif; margin: 0; padding-top: 60px; padding-bottom: 120px; touch-action: manipulation; }
        
        /* Header */
        .header { padding: 0 15px; background: #1a1c23; display: flex; justify-content: space-between; align-items: center; z-index: 20; position: fixed; top: 0; left: 0; width: 100%; box-sizing: border-box; border-bottom: 1px solid #333; height: 60px;}
        .btn-back { background: #4b5563; color: white; padding: 8px 12px; border-radius: 5px; text-decoration: none; font-size: 14px; font-weight: bold; border: none; cursor: pointer;}
        .btn-capture { background: #e50914; color: white; padding: 8px 12px; border-radius: 5px; border: none; font-weight: bold; cursor: pointer; font-size: 14px;}
        
        /* Footer แถบสถานะ */
        .footer { background: #1a1c23; display: flex; justify-content: center; align-items: center; z-index: 20; position: fixed; bottom: 0; left: 0; width: 100%; box-sizing: border-box; border-top: 1px solid #333; height: 50px;}
        .legend { display: flex; align-items: center; font-size: 12px; font-weight: bold;}
        .legend span { display: inline-block; width: 12px; height: 12px; margin: 0 5px 0 12px; border-radius: 3px; }
        
        /* ช่องค้นหา (แสดงเฉพาะโหมดตรวจสอบผัง) */
        .search-container {
            display: none; 
            position: fixed;
            bottom: 65px; 
            left: 50%;
            transform: translateX(-50%);
            gap: 8px;
            background: #1f2937;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
            z-index: 25;
            width: 90%;
            max-width: 450px;
            box-sizing: border-box;
            border: 1px solid #4b5563;
        }
        .search-container input {
            flex: 1;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #4b5563;
            background: #111827;
            color: white;
            font-size: 14px;
        }
        .search-container button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 0 15px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        /* Loading Overlay */
        #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: #0f1115; z-index: 50; }

        /* ---------------------------------
           หน้า 1: ภาพรวมทุกโซน (Overview)
        --------------------------------- */
        #view-overview { padding: 15px; margin: 0 auto; display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        
        .overview-layout { 
            display: grid; 
            grid-template-columns: 1.5fr 1fr 1.5fr 1fr 1.5fr;
            gap: 8px; 
            margin: 0 auto;
            min-width: 900px; 
            width: 100%;
            padding-top: 65px;
        }
        
        /* เวที (ปรับรูปทรงตัว T ให้เป็นเนื้อเดียวกัน) */
        .stage-container { 
            grid-area: 1 / 3; 
            position: relative; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            height: 100%; 
        }
        .stage-main { 
            position: absolute;
            bottom: calc(100% + 8px); /* เว้นช่องว่างจากโซน VIP 8 พิกเซล */
            width: 250%; 
            height: 55px; 
            background: #ffb74d; 
            border-radius: 6px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            color: #000; 
            font-weight: bold; 
            font-size: 15px;
            z-index: 5;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .stage-catwalk { 
            width: 45%; 
            height: calc(100% + 8px); /* ยืดความสูงขึ้นไปเชื่อมให้ติดกับเวทีหลักพอดี */
            margin-top: -8px; /* ดันขึ้นไปชดเชยช่องว่าง */
            background: #ffb74d; 
            border-bottom-left-radius: 6px; 
            border-bottom-right-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            position: relative;
            z-index: 4;
        }

        /* กล่องโซน */
        .zone-box { 
            background: #1a1c23; border: 1px solid #333; border-radius: 6px; 
            padding: 8px; cursor: pointer; transition: 0.1s; 
            box-sizing: border-box; width: 100%; overflow: hidden;
        }
        .zone-box:active { background: #2d3748; transform: scale(0.98); }
        .zone-box.vip { border: 1px solid #941724; background: #221013; }
        
        .zone-box-title { text-align: center; font-size: 10px; font-weight: bold; margin-bottom: 6px; color: #fff; background: #941724; padding: 3px; border-radius: 4px;}
        .zone-box-title.normal { background: #263238; }
        
        .mini-seats-grid { 
            display: grid; gap: 2px; width: 100%; 
            container-type: inline-size; 
        }
        .grid-mini-10 { grid-template-columns: repeat(10, 1fr); }
        .grid-mini-15 { grid-template-columns: repeat(15, 1fr); }
        
        .mini-seat { 
            width: 100%; aspect-ratio: 1; border-radius: 1px; 
            line-height: 1; font-weight: bold; 
            display: flex; justify-content: center; align-items: center;
            box-sizing: border-box; overflow: hidden;
        }

        .grid-mini-10 .mini-seat { font-size: clamp(6px, 4.5cqw, 16px); }
        .grid-mini-15 .mini-seat { font-size: clamp(5.5px, 3.2cqw, 14px); }

        /* ---------------------------------
           หน้า 2: เจาะจงโซน (Zone Detail)
        --------------------------------- */
        #view-zone { display: none; padding: 15px; max-width: 100%; margin: 0 auto; box-sizing: border-box;}
        
        .zone-header-bar { display: flex; justify-content: space-between; align-items: center; background: #1a1c23; padding: 12px 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333;}
        .zone-header-bar h2 { margin: 0; font-size: 16px; color: #ffb74d;}
        
        .zone-scroll-container {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 20px;
        }

        .seats-grid { display: grid; justify-content: center; margin: 0 auto; padding: 0 10px;}
        .grid-15 { grid-template-columns: repeat(15, 34px); gap: 6px; min-width: 630px; }
        .grid-10 { grid-template-columns: repeat(10, 38px); gap: 8px; min-width: 460px; }
        
        .seat { 
            aspect-ratio: 1; width: 100%; border-radius: 4px; cursor: pointer; 
            font-size: 11px; font-weight: bold; display: flex; justify-content: center; align-items: center; 
        }
        .seat:active { transform: scale(0.9); }
        
        .status-Available { background: #374151; color: #9ca3af; }
        .status-Pending { background: #f59e0b; color: #000; }
        .status-Booked { background: #dc2626; color: #fff; }
        
        /* Modal & Pop-up */
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1f2937; padding: 20px; border-radius: 12px; z-index: 100; width: 85%; max-width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,0.9); border: 1px solid #4b5563;}
        .modal h3 { margin-top: 0; color: #f3f4f6; text-align: center; font-size: 18px;}
        .input-group { margin-bottom: 12px; text-align: left; }
        .input-group label { display: block; font-size: 12px; color: #9ca3af; margin-bottom: 4px; }
        .input-group input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #4b5563; background: #111827; color: white; box-sizing: border-box; font-size: 15px;}
        .action-btns { display: flex; flex-direction: column; gap: 8px; }
        .modal button { padding: 10px; cursor: pointer; border: none; border-radius: 6px; font-weight: bold; font-size: 14px;}
        .backdrop { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 90;}
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" class="btn-back">← ออกระบบ</a>
        <span id="currentUser" style="color:#ffb74d; font-weight: bold; font-size: 13px;"></span>
        <button class="btn-capture" id="btnCapture" onclick="handleCapture()">แคปผังรวม</button>
    </div>

    <!-- ช่องค้นหาสำหรับผู้ชมทั่วไป -->
    <div class="search-container" id="searchContainer">
        <input type="text" id="searchInput" placeholder="ค้นหาด้วยชื่อ หรือ เบอร์โทร...">
        <button onclick="searchSeat()">ค้นหา</button>
    </div>

    <div id="loadingOverlay">
        <h2 style="color: #888;">กำลังโหลดข้อมูล...</h2>
    </div>

    <!-- หน้า 1: ภาพรวมทุกโซน -->
    <div id="view-overview">
        <div class="overview-layout" id="overviewLayout">
            <div class="stage-container">
                <div class="stage-main">STAGE</div>
                <div class="stage-catwalk"></div>
            </div>
        </div>
    </div>

    <!-- หน้า 2: เจาะจงโซน -->
    <div id="view-zone">
        <div class="zone-header-bar">
            <button class="btn-back" onclick="showOverview()">← กลับภาพรวม</button>
            <h2 id="currentZoneTitle">ZONE Name</h2>
        </div>
        <div class="zone-scroll-container">
            <div class="seats-grid" id="zoneSeatsGrid"></div>
        </div>
    </div>

    <div class="footer">
        <div class="legend">
            <span style="background:#374151;"></span>ว่าง
            <span style="background:#f59e0b;"></span>รอโอน
            <span style="background:#dc2626;"></span>จองแล้ว
        </div>
    </div>

    <div class="backdrop" id="modalBackdrop" onclick="closeModal()"></div>
    
    <!-- Modal อัปเดตข้อมูล (สำหรับแอดมิน) -->
    <div class="modal" id="actionModal">
        <h3 id="modalSeatId"></h3>
        <div class="input-group"><label>ชื่อลูกค้า</label><input type="text" id="custName" placeholder="กรอกชื่อลูกค้า"></div>
        <div class="input-group"><label>เบอร์โทรศัพท์</label><input type="text" id="custPhone" placeholder="กรอกเบอร์โทร"></div>
        <div class="action-btns">
            <button style="background: #dc2626; color: white;" onclick="updateStatus('Booked')">ยืนยันจอง (Booked)</button>
            <button style="background: #f59e0b; color: black;" onclick="updateStatus('Pending')">รอโอน (Pending)</button>
            <button style="background: #374151; color: white;" onclick="updateStatus('Available')">ยกเลิกจอง (ตั้งเป็นว่าง)</button>
            <button style="background: transparent; color: #9ca3af; border: 1px solid #4b5563;" onclick="closeModal()">ปิด</button>
        </div>
    </div>

    <!-- Modal แจ้งผลการค้นหา และดูข้อมูลสำหรับผู้ชม -->
    <div class="modal" id="searchResultModal">
        <h3 id="searchModalTitle" style="color: #4ade80;">ผลการค้นหา</h3>
        <div id="searchResultMsg" style="margin: 15px 0; font-size: 15px; line-height: 1.6; text-align: center;"></div>
        <button style="width: 100%; background: #374151; color: white; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;" onclick="closeModal()">ปิดหน้าต่าง</button>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxnh9eh_SQBpkuEVlb42onEWnUNmMtGtujz1yStLz70OSUnDVWKFRvG_sztDXcKhU81/exec"; 
        
        const adminName = sessionStorage.getItem('adminName');
        const isGuest = !adminName || adminName === "Guest";
        
        document.getElementById('currentUser').innerText = !isGuest ? `Admin: ${adminName}` : "ผู้ชมทั่วไป";
        
        if (isGuest) {
            document.getElementById('searchContainer').style.display = "flex";
        }

        let seatDataMap = {}; 
        let zoneData = {}; 
        let currentSelectedSeat = "";
        let currentViewedZone = "";

        const layoutGrid = {
            "ZONE A": "1 / 1", "VIP 1": "1 / 2", "VIP 2": "1 / 4", "ZONE B": "1 / 5",
            "ZONE C": "2 / 1", "VIP 3": "2 / 2", "VIP 4": "2 / 3", "VIP 5": "2 / 4", "ZONE D": "2 / 5",
            "ZONE E": "3 / 1", "VIP 6": "3 / 2", "VIP 7": "3 / 3", "VIP 8": "3 / 4", "ZONE F": "3 / 5",
            "ZONE G": "4 / 1", "ZONE H": "4 / 2", "ZONE I": "4 / 3", "ZONE J": "4 / 4", "ZONE K": "4 / 5",
            "ZONE L": "5 / 1", "ZONE M": "5 / 2", "ZONE N": "5 / 3", "ZONE O": "5 / 4", "ZONE P": "5 / 5",
            "ZONE Q": "6 / 1", "ZONE R": "6 / 2", "ZONE S": "6 / 3", "ZONE T": "6 / 4", "ZONE U": "6 / 5"
        };

        async function loadSeats() {
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: "getSeats" })
                });
                const result = await response.json();
                
                if (result.status === "success") {
                    document.getElementById('loadingOverlay').style.display = 'none';
                    processData(result.data);
                    renderOverview();
                } else {
                    document.getElementById('loadingOverlay').innerHTML = `<h2 style="color:red;">ข้อผิดพลาด: ${result.message}</h2>`;
                }
            } catch (e) {
                document.getElementById('loadingOverlay').innerHTML = `<h2 style="color:red;">ไม่สามารถเชื่อมต่อฐานข้อมูลได้</h2>`;
            }
        }

        function processData(data) {
            seatDataMap = {};
            zoneData = {};
            
            data.forEach(row => {
                const id = row[0].toString().trim(); 
                if(!id) return;
                
                seatDataMap[id] = {
                    status: row[3] ? row[3].toString().trim() : "Available",
                    customerName: row[4] ? row[4].toString().trim() : "",
                    phone: row[7] ? row[7].toString().trim() : ""
                };

                const prefix = id.split('-')[0]; 
                if (!zoneData[prefix]) zoneData[prefix] = [];
                zoneData[prefix].push(id);
            });
        }

        function renderOverview() {
            const overviewLayout = document.getElementById('overviewLayout');
            const oldBoxes = overviewLayout.querySelectorAll('.zone-box');
            oldBoxes.forEach(b => b.remove());

            Object.keys(zoneData).forEach(zoneName => {
                const isVip = zoneName.includes('VIP');
                
                const box = document.createElement('div');
                box.className = `zone-box ${isVip ? 'vip' : ''}`;
                if (layoutGrid[zoneName]) box.style.gridArea = layoutGrid[zoneName];
                
                const titleDiv = document.createElement('div');
                titleDiv.className = `zone-box-title ${isVip ? '' : 'normal'}`;
                titleDiv.innerText = zoneName;
                box.appendChild(titleDiv);

                const miniGrid = document.createElement('div');
                const seatCount = zoneData[zoneName].length;
                
                miniGrid.className = `mini-seats-grid ${seatCount > 50 ? 'grid-mini-15' : 'grid-mini-10'}`;

                zoneData[zoneName].forEach(seatId => {
                    const info = seatDataMap[seatId];
                    const seatNumber = parseInt(seatId.split('-')[1], 10);
                    
                    const miniSeat = document.createElement('div');
                    miniSeat.className = `mini-seat status-${info.status}`;
                    miniSeat.innerText = seatNumber;
                    miniGrid.appendChild(miniSeat);
                });

                box.appendChild(miniGrid);
                box.onclick = () => openZoneDetail(zoneName);
                overviewLayout.appendChild(box);
            });
        }

        function openZoneDetail(zoneName) {
            currentViewedZone = zoneName;
            document.getElementById('view-overview').style.display = 'none';
            document.getElementById('view-zone').style.display = 'block';
            document.getElementById('currentZoneTitle').innerText = zoneName;
            document.getElementById('btnCapture').innerText = "แคปโซนนี้";
            
            if (isGuest) document.getElementById('searchContainer').style.display = "none";
            
            renderZoneSeats(zoneName);
            window.scrollTo(0, 0);
        }

        function showOverview() {
            document.getElementById('view-zone').style.display = 'none';
            document.getElementById('view-overview').style.display = 'block';
            document.getElementById('btnCapture').innerText = "แคปผังรวม";
            
            if (isGuest) document.getElementById('searchContainer').style.display = "flex";
            
            renderOverview();
        }

        function renderZoneSeats(zoneName) {
            const grid = document.getElementById('zoneSeatsGrid');
            grid.innerHTML = "";
            
            const seatCount = zoneData[zoneName].length;
            grid.className = `seats-grid ${seatCount > 50 ? 'grid-15' : 'grid-10'}`;
            
            zoneData[zoneName].forEach(seatId => {
                const info = seatDataMap[seatId];
                const seatNumber = parseInt(seatId.split('-')[1], 10);
                
                const btn = document.createElement('div');
                btn.className = `seat status-${info.status}`; 
                btn.id = `seat-${seatId}`;
                btn.innerText = seatNumber; 
                
                // แก้ไขแล้ว: ให้ทุกคนคลิกที่นั่งได้ (ทั้งแอดมินและผู้ชม)
                btn.onclick = () => openModal(seatId);
                
                grid.appendChild(btn);
            });
        }

        function searchSeat() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            if(!query) {
                alert("กรุณากรอกชื่อหรือเบอร์โทรที่ต้องการค้นหา");
                return;
            }

            let foundSeats = [];
            let foundName = "";
            let foundPhone = "";

            Object.keys(seatDataMap).forEach(seatId => {
                const info = seatDataMap[seatId];
                if (info.status !== 'Available') {
                    const cName = (info.customerName || "").toLowerCase();
                    const cPhone = (info.phone || "").toLowerCase();
                    
                    if (cName.includes(query) || cPhone.includes(query)) {
                        foundSeats.push(seatId);
                        if(!foundName) foundName = info.customerName; 
                        if(!foundPhone) foundPhone = info.phone; 
                    }
                }
            });

            const modalTitle = document.getElementById('searchModalTitle');
            const resultMsg = document.getElementById('searchResultMsg');
            
            modalTitle.innerText = "ผลการค้นหา";
            modalTitle.style.color = "#4ade80";

            if (foundSeats.length > 0) {
                // เพิ่มเบอร์โทรศัพท์ลงใน Pop-up ผลการค้นหา
                resultMsg.innerHTML = 
                    `<div style="margin-bottom:10px;">พบการจองของคุณ <b>${foundName}</b></div>
                     <div style="margin-bottom:10px; color:#9ca3af; font-size:14px;">เบอร์โทร: <b>${foundPhone || "-"}</b></div>
                     <div style="color:#4ade80; font-size:18px;">ที่นั่ง: <b>${foundSeats.join(', ')}</b></div>`;
            } else {
                resultMsg.innerHTML = `<span style="color:#f87171;">ไม่พบข้อมูลการจองที่ตรงกับคำค้นหา</span>`;
            }
            
            document.getElementById('modalBackdrop').style.display = "block";
            document.getElementById('searchResultModal').style.display = "block";
        }

        function openModal(seatId) {
            currentSelectedSeat = seatId;
            const info = seatDataMap[seatId];
            
            if (isGuest) {
                const modalTitle = document.getElementById('searchModalTitle');
                const resultMsg = document.getElementById('searchResultMsg');
                
                modalTitle.innerText = "ข้อมูลที่นั่ง";
                modalTitle.style.color = "#ffb74d";
                
                if (info.status === 'Available') {
                    resultMsg.innerHTML = `<div style="font-size:18px;">ที่นั่ง <b>${seatId}</b></div><div style="color:#4ade80; margin-top:10px;">สถานะ: ว่าง</div>`;
                } else {
                    const statusText = info.status === 'Booked' ? '<span style="color:#dc2626;">จองแล้ว</span>' : '<span style="color:#f59e0b;">รอโอน</span>';
                    resultMsg.innerHTML = 
                        `<div style="font-size:18px; margin-bottom:15px;">ที่นั่ง <b>${seatId}</b></div>
                         <div style="text-align:left; background:#111827; padding:15px; border-radius:8px; border:1px solid #374151;">
                            <div style="margin-bottom:8px; color:#9ca3af;">สถานะ: ${statusText}</div>
                            <div style="margin-bottom:8px; color:#9ca3af;">ชื่อลูกค้า: <span style="color:white; font-weight:bold;">${info.customerName || "-"}</span></div>
                            <div style="color:#9ca3af;">เบอร์โทร: <span style="color:white; font-weight:bold;">${info.phone || "-"}</span></div>
                         </div>`;
                }
                
                document.getElementById('modalBackdrop').style.display = "block";
                document.getElementById('searchResultModal').style.display = "block";
            } 
            else {
                document.getElementById('modalSeatId').innerText = "ที่นั่ง: " + seatId;
                document.getElementById('custName').value = info.customerName || "";
                document.getElementById('custPhone').value = info.phone || "";
                
                document.getElementById('modalBackdrop').style.display = "block";
                document.getElementById('actionModal').style.display = "block";
            }
        }

        function closeModal() {
            document.getElementById('modalBackdrop').style.display = "none";
            document.getElementById('actionModal').style.display = "none";
            document.getElementById('searchResultModal').style.display = "none";
        }

        async function updateStatus(newStatus) {
            const cName = document.getElementById('custName').value;
            const cPhone = document.getElementById('custPhone').value;

            closeModal();
            
            const seatElem = document.getElementById(`seat-${currentSelectedSeat}`);
            if (seatElem) seatElem.className = `seat status-${newStatus}`;
            
            seatDataMap[currentSelectedSeat].status = newStatus;
            seatDataMap[currentSelectedSeat].customerName = newStatus === 'Available' ? "" : cName;
            seatDataMap[currentSelectedSeat].phone = newStatus === 'Available' ? "" : cPhone;

            fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ 
                    action: "updateSeat", 
                    seatId: currentSelectedSeat, 
                    newStatus: newStatus,
                    adminName: adminName,
                    customerName: newStatus === 'Available' ? "" : cName,
                    customerPhone: newStatus === 'Available' ? "" : cPhone
                })
            });
        }

        function handleCapture() {
            const searchBox = document.getElementById('searchContainer');
            if(searchBox) searchBox.style.display = "none";

            const isOverviewVisible = document.getElementById('view-overview').style.display !== 'none';
            if (isOverviewVisible) {
                captureOverviewMap();
            } else {
                captureSingleZoneMap();
            }
        }

        function captureOverviewMap() {
            const btn = document.getElementById('btnCapture');
            const originalText = btn.innerText;
            btn.innerText = "กำลังแคป...";
            
            const layout = document.getElementById('overviewLayout');
            
            const cloneWrapper = document.createElement('div');
            cloneWrapper.style.position = 'absolute';
            cloneWrapper.style.top = '0';
            cloneWrapper.style.left = '-9999px'; 
            cloneWrapper.style.width = 'max-content'; 
            cloneWrapper.style.background = '#0f1115';
            cloneWrapper.style.padding = '20px';
            cloneWrapper.style.zIndex = '-1';
            
            const clone = layout.cloneNode(true);
            cloneWrapper.appendChild(clone);
            document.body.appendChild(cloneWrapper);

            const exactWidth = clone.scrollWidth + 40;

            html2canvas(cloneWrapper, { 
                backgroundColor: "#0f1115",
                scale: 2.5,
                windowWidth: exactWidth 
            }).then(canvas => {
                let link = document.createElement('a');
                link.download = 'Overview_Seating_Map.png';
                link.href = canvas.toDataURL("image/png");
                link.click();
                
                document.body.removeChild(cloneWrapper);
                btn.innerText = originalText;
                if(isGuest) document.getElementById('searchContainer').style.display = "flex"; 
            }).catch(e => {
                document.body.removeChild(cloneWrapper);
                btn.innerText = originalText;
                if(isGuest) document.getElementById('searchContainer').style.display = "flex";
                alert("เกิดข้อผิดพลาดในการบันทึกภาพ");
            });
        }

        function captureSingleZoneMap() {
            const btn = document.getElementById('btnCapture');
            const originalText = btn.innerText;
            btn.innerText = "กำลังแคปโซน...";
            
            const zoneContainer = document.getElementById('zoneSeatsGrid');
            
            const cloneWrapper = document.createElement('div');
            cloneWrapper.style.position = 'absolute';
            cloneWrapper.style.top = '0';
            cloneWrapper.style.left = '-9999px'; 
            cloneWrapper.style.width = 'max-content'; 
            cloneWrapper.style.background = '#0f1115';
            cloneWrapper.style.padding = '30px';
            cloneWrapper.style.zIndex = '-1';
            
            const titleHeader = document.createElement('h2');
            titleHeader.innerText = currentViewedZone;
            titleHeader.style.color = '#ffb74d';
            titleHeader.style.textAlign = 'center';
            titleHeader.style.fontFamily = 'sans-serif';
            titleHeader.style.marginBottom = '20px';
            cloneWrapper.appendChild(titleHeader);

            const clone = zoneContainer.cloneNode(true);
            clone.style.margin = '0 auto';
            cloneWrapper.appendChild(clone);
            document.body.appendChild(cloneWrapper);

            const exactWidth = clone.scrollWidth + 60;

            html2canvas(cloneWrapper, { 
                backgroundColor: "#0f1115",
                scale: 2.5,
                windowWidth: exactWidth 
            }).then(canvas => {
                let link = document.createElement('a');
                link.download = `${currentViewedZone}_Map.png`;
                link.href = canvas.toDataURL("image/png");
                link.click();
                
                document.body.removeChild(cloneWrapper);
                btn.innerText = originalText;
            }).catch(e => {
                document.body.removeChild(cloneWrapper);
                btn.innerText = originalText;
                alert("เกิดข้อผิดพลาดในการบันทึกภาพโซน");
            });
        }

        loadSeats();
    </script>
